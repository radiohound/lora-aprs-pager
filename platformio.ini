; LilyGO T-LoRa Pager (433 MHz) LoRa APRS tracker + station map
; Milestone 1: board bring-up only. Nothing here transmits.
[env:pager]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi   ; 8 MB QSPI PSRAM (not octal)
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<bench/>
lib_deps =
  lovyan03/LovyanGFX@1.2.24
  jgromes/RadioLib@^7.1.0

; Raster tile benchmark (read-only: SD + screen, no radio). Build: pio run -e bench
[env:bench]
extends = env:pager
build_src_filter = -<*> +<bench/>

; Same benchmark on a T-Deck (read-only too, but it REPLACES the app firmware: back up the flash first).
[env:bench_tdeck]
extends = env:bench
board_build.arduino.memory_type = qio_opi   ; T-Deck: quad flash + OPI (octal) PSRAM
build_flags =
  ${env:bench.build_flags}
  -D BENCH_TDECK

; Tile viewer: draws the T-Deck card's tiles placed by x/y, knob to zoom and pan (read-only on the card). Build: pio run -e viewer
[env:viewer]
extends = env:pager
build_src_filter = -<*> +<viewer/>
board_build.embed_files = src/symbols24.bin   ; APRS icons, see tools/make_symbols.py
