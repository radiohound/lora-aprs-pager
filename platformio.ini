; LilyGO T-LoRa Pager (433 MHz) LoRa APRS tracker + station map
; Environments: app = the application (the one to build and flash); pager = the milestone-1 bring-up test (nothing transmits);
; bench / bench_tdeck = read-only SD tile benchmarks. Only "app" is needed to use the pager.
[env:pager]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi   ; 8 MB QSPI PSRAM (not octal)
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=0
  -ffile-prefix-map=${platformio.packages_dir}=pio-packages   ; keep the builder's home folder out of the binary
build_src_filter = +<*> -<bench/>
lib_deps =
  lovyan03/LovyanGFX@1.2.24
  jgromes/RadioLib@^7.1.0

; Raster tile benchmark (read-only: SD + screen, no radio). Build: pio run -e bench
[env:bench]
extends = env:pager
build_src_filter = -<*> +<bench/>

; Same benchmark on a T-Deck (read-only too, but it REPLACES the app firmware: back up the flash first).
[env:bench_tdeck]
extends = env:bench
board_build.arduino.memory_type = qio_opi   ; T-Deck: quad flash + OPI (octal) PSRAM
build_flags =
  ${env:bench.build_flags}
  -D BENCH_TDECK

; The application (map, stations, beacon, messaging, phone setup). Reads the SD card, never writes it. Build: pio run -e app
[env:app]
extends = env:pager
build_src_filter = -<*> +<app/>
board_build.filesystem = littlefs
; APRS icons for the map (tools/make_symbols.py) and the same icons as picture sheets for the phone setup page (tools/make_symbol_sheets.py)
board_build.embed_files =
  src/symbols24.bin
  src/emoji18.bin
  src/web/sym0.png
  src/web/sym1.png
; Bosch BHI260AP motion sensor (firmware blob + driver); used by the motion wake for the GPS
lib_deps =
  ${env:pager.lib_deps}
  lewisxhe/SensorLib@0.5.2
